[project]
name = "daytrade-lab"
version = "0.1.0"
description = "단타 전략 검증기 - 단타 자동매매 전략의 수익 구조를 데이터로 검증하는 FastAPI 서비스"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
